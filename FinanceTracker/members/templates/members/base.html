{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}Finance Hub{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'members/dashboard.css' %}?v=noir-1">
    <script src="{% static 'members/finance-ui.js' %}?v=noir-1" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <!-- Reusable line icons, drawn locally: no external icon package needed. -->
    <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
            <symbol id="icon-overview" viewBox="0 0 24 24"><path d="M4 20V11h4v9M10 20V4h4v16M16 20V8h4v12"/></symbol>
            <symbol id="icon-ledger" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/></symbol>
            <symbol id="icon-budget" viewBox="0 0 24 24"><path d="M11 3a9 9 0 1 0 10 10H11zM15 3v6h6a9 9 0 0 0-6-6z"/></symbol>
            <symbol id="icon-card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M6 15h4"/></symbol>
            <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M9 4H4v16h5M9 12h12M16 7l5 5-5 5"/></symbol>
            <symbol id="icon-cart" viewBox="0 0 24 24"><path d="M2 4h3l3 12h11l3-9H6M9 20h.01M18 20h.01"/></symbol>
            <symbol id="icon-coffee" viewBox="0 0 24 24"><path d="M4 7h12v9a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM16 8h2a3 3 0 1 1 0 6h-2M7 2v2M12 2v2"/></symbol>
            <symbol id="icon-income" viewBox="0 0 24 24"><path d="M12 3v17M5 13l7 7 7-7"/></symbol>
            <symbol id="icon-fuel" viewBox="0 0 24 24"><path d="M4 21V4h10v17M2 21h14M6 7h6v5H6zM14 11h2v7a2 2 0 0 0 4 0V8l-3-3M18 6v5h2"/></symbol>
            <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M3 12h18M15 6l6 6-6 6"/></symbol>
            <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
        </defs>
    </svg>
    {% block layout %}{% endblock %}
</body>
</html>
