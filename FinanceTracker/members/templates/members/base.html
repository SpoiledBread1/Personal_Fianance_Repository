{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Finance Hub{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'members/dashboard.css' %}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{% url 'finance:dashboard' %}"><span class="brand-icon" aria-hidden="true">F</span> Finance Hub</a>
  {% if user.is_authenticated %}
  <form method="post" action="{% url 'finance:logout' %}">{% csrf_token %}<button class="secondary" type="submit">Log out</button></form>
  {% else %}<span class="muted">Your money, in one place.</span>{% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
<footer>Finance Hub · Student project</footer>
</body>
</html>
