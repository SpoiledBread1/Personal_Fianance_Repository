services:
  - type: web
    name: finance-hub-demo-aidan
    runtime: python
    plan: free
    buildCommand: pip install -r requirements && python FinanceTracker/manage.py collectstatic --no-input
    preDeployCommand: python FinanceTracker/manage.py migrate
    startCommand: gunicorn --chdir FinanceTracker FinanceTracker.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-hub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: FINNHUB_API_KEY
        sync: false
      - key: MARKET_WATCHLIST
        value: AAPL,MSFT,NVDA
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.12"

databases:
  - name: finance-hub-db
    plan: free